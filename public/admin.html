<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | BinaryBond</title>
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/console.css">
  <script type="module" src="/js/admin.js"></script>
</head>
<body>
  <!--#sprite-->
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/"><svg class="brand-mark" aria-hidden="true"><use href="#i-logo"/></svg><span class="brand-name">BinaryBond</span></a>
      <span class="tag tag-primary">Admin</span>
      <div class="header-actions">
        <button class="btn btn-sm" id="refresh" type="button" hidden><svg class="ic"><use href="#i-refresh"/></svg>Refresh</button>
        <button class="btn btn-sm" id="signOut" type="button" hidden><svg class="ic"><use href="#i-log-out"/></svg>Sign out</button>
      </div>
    </div>
  </header>
  <div class="console-page">
    <main class="console" id="root" aria-live="polite"></main>
  </div>
</body>
</html>
